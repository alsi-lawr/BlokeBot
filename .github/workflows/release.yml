name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Run reusable release workflow
    uses: alsi-lawr/package-release-workflows/.github/workflows/package-dotnet.yml@main
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PACKAGE_REPOSITORY_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
    with:
      dotnet_version: '10.0.301'
      dotnet_project_path: src/BlokeBot/BlokeBot.csproj
      package_publish_matrix: '[{"rid":"linux-x64","runner":"ubuntu-26.04","machine":"x86_64","executable":"artifacts/publish/linux-x64/blokebot"},{"rid":"linux-arm64","runner":"ubuntu-26.04-arm","machine":"aarch64","executable":"artifacts/publish/linux-arm64/blokebot"},{"rid":"osx-arm64","runner":"macos-latest","machine":"arm64","executable":"artifacts/publish/osx-arm64/blokebot"},{"rid":"win-x64","runner":"windows-latest","machine":"amd64","executable":"artifacts/publish/win-x64/blokebot.exe"},{"rid":"win-arm64","runner":"windows-11-arm","machine":"arm64","executable":"artifacts/publish/win-arm64/blokebot.exe"}]'
      package_smoke_script: packaging/smoke/native_smoke.py
      package_name: blokebot
      command_name: blokebot
      release_name: BlokeBot
      smoke_script: packaging/smoke/native_smoke.py
      container_smoke_script: packaging/smoke/container_smoke.py
      release_title_prefix: BlokeBot
      brew_formula_path: artifacts/package-metadata/blokebot/brew/Formula/blokebot.rb
      scoop_manifest_path: artifacts/package-metadata/blokebot/scoop/bucket/blokebot.json
      chocolatey_nuspec_path: artifacts/package-metadata/blokebot/chocolatey/blokebot/blokebot.nuspec
      winget_manifest_prefix: artifacts/package-metadata/blokebot/winget/manifests/a/alsi-lawr/BlokeBot
      winget_identifier: alsi-lawr.BlokeBot
      publish_github_release: true
      publish_homebrew: true
      publish_scoop: true
      publish_winget: true
      publish_nixpkgs: true
      publish_chocolatey: true
      publish_docker_hub: true
      publish_nix_images: true
      promote_latest: true
      run_package_tests: true
      run_homebrew_test: true
      run_windows_packaging_tests: true
      run_winget_test: true
      jreleaser_image: jreleaser/jreleaser-slim:v1.25.0
      jreleaser_config: packaging/jreleaser/jreleaser.yml
      package_metadata_finalize_script: packaging/jreleaser/finalize_metadata.sh
      winget_upstream_repo: microsoft/winget-pkgs
      winget_fork_owner: ${{ github.repository_owner }}
      winget_fork_repo: winget-pkgs
      winget_branch_prefix: winget-blokebot-v
      nix_upstream_repo: NixOS/nixpkgs
      nix_fork_owner: ${{ github.repository_owner }}
      nix_fork_repo: nixpkgs
      nix_branch_prefix: blokebot-v
      nix_package_name: blokebot
      nix_package_template_path: packaging/nix/nixpkgs-package.nix
      nix_package_dependencies_path: packaging/nix/deps.json
      docker_build_matrix: '[{"kind":"blokebot","arch":"amd64","runner":"ubuntu-26.04","dockerfile":"packaging/docker/blokebot.Dockerfile","image":"docker.io/alsilawr/blokebot"},{"kind":"blokebot","arch":"arm64","runner":"ubuntu-26.04-arm","dockerfile":"packaging/docker/blokebot.Dockerfile","image":"docker.io/alsilawr/blokebot"},{"kind":"blokebot-site","arch":"amd64","runner":"ubuntu-26.04","dockerfile":"packaging/docker/blokebot-site.Dockerfile","image":"docker.io/alsilawr/blokebot-site"},{"kind":"blokebot-site","arch":"arm64","runner":"ubuntu-26.04-arm","dockerfile":"packaging/docker/blokebot-site.Dockerfile","image":"docker.io/alsilawr/blokebot-site"}]'
      docker_manifest_images: '["docker.io/alsilawr/blokebot","docker.io/alsilawr/blokebot-site"]'
      ghcr_build_matrix: '[{"kind":"blokebot","smoke_kind":"bot","arch":"amd64","runner":"ubuntu-26.04","output":"blokebot-image","image":"ghcr.io/alsi-lawr/blokebot"},{"kind":"blokebot","smoke_kind":"bot","arch":"arm64","runner":"ubuntu-26.04-arm","output":"blokebot-image","image":"ghcr.io/alsi-lawr/blokebot"},{"kind":"blokebot-site","smoke_kind":"site","arch":"amd64","runner":"ubuntu-26.04","output":"blokebot-site-image","image":"ghcr.io/alsi-lawr/blokebot-site"},{"kind":"blokebot-site","smoke_kind":"site","arch":"arm64","runner":"ubuntu-26.04-arm","output":"blokebot-site-image","image":"ghcr.io/alsi-lawr/blokebot-site"}]'
      ghcr_manifest_images: '["ghcr.io/alsi-lawr/blokebot","ghcr.io/alsi-lawr/blokebot-site"]'
      promotion_image_matrix: '["docker.io/alsilawr/blokebot","docker.io/alsilawr/blokebot-site","ghcr.io/alsi-lawr/blokebot","ghcr.io/alsi-lawr/blokebot-site"]'
