name: Build and test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Restore, format, build, and test
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301
      - name: Install Lua language server
        env:
          LUALS_SHA256: ca71415dd19f19e30aaa35a4915aefca9fdb5fec31b98331cc3d77f778d539c5
          LUALS_VERSION: 3.18.2
        run: |
          archive="$RUNNER_TEMP/lua-language-server.tar.gz"
          destination="$RUNNER_TEMP/lua-language-server"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz"
          echo "$LUALS_SHA256  $archive" | sha256sum --check
          mkdir --parents "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination"
          echo "$destination/bin" >> "$GITHUB_PATH"
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check C# formatting
        run: dotnet csharpier check .
      - name: Test native smoke cleanup
        run: python -m unittest discover -s packaging/smoke -p "test_*.py"
      - name: Build and test
        run: >-
          dotnet test BlokeBot.slnx
          --configuration Release
          --property:TreatWarningsAsErrors=true
          --
          --no-ansi
          --no-progress
          --output Normal
