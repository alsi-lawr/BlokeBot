name: Validation

on:
  workflow_call:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Restore, format, build, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Restore solution and tools
        run: |
          dotnet restore BlokeBot.slnx
          dotnet tool restore
      - name: Check CSharpier formatting
        run: dotnet csharpier check .
      - name: Build with warnings as errors
        run: dotnet build BlokeBot.slnx --no-restore -warnaserror
      - name: Run the complete Microsoft Testing Platform suite
        run: dotnet test BlokeBot.slnx --no-build

  jreleaser:
    name: Validate deterministic JReleaser packaging
    runs-on: ubuntu-24.04
    env:
      JRELEASER_IMAGE: jreleaser/jreleaser-slim@sha256:18f1e6106f1a540348cd0aafdb600702397c6873ce1ab5bfc0ad25082d13db5f
      JRELEASER_PROJECT_VERSION: 1.2.3
      JRELEASER_GITHUB_TOKEN: validation-only
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Prove the immutable JReleaser image is version 1.25.0
        run: |
          version_output=$(docker run --rm "$JRELEASER_IMAGE" --version)
          printf '%s\n' "$version_output"
          grep -Fqx 'jreleaser 1.25.0' <<< "$version_output"
      - name: Create five publish-directory fixtures
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64; do
            mkdir -p "artifacts/publish/$rid"
            printf 'fixture %s\n' "$rid" > "artifacts/publish/$rid/blokebot"
            chmod +x "artifacts/publish/$rid/blokebot"
          done
          for rid in win-x64 win-arm64; do
            mkdir -p "artifacts/publish/$rid"
            printf 'fixture %s\n' "$rid" > "artifacts/publish/$rid/blokebot.exe"
          done
      - name: Validate strict full configuration
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/workspace"
          -e JRELEASER_PROJECT_VERSION
          -e JRELEASER_GITHUB_TOKEN
          "$JRELEASER_IMAGE"
          config --strict --full --reproducible
          --basedir /workspace
          --config-file packaging/jreleaser/jreleaser.yml
      - name: Assemble package archives
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e JRELEASER_PROJECT_VERSION \
            -e JRELEASER_GITHUB_TOKEN \
            "$JRELEASER_IMAGE" \
            assemble --strict --reproducible \
            --basedir /workspace \
            --config-file packaging/jreleaser/jreleaser.yml
      - name: Remove nondeterministic ZIP extra fields with standard tools
        run: |
          for archive in out/jreleaser/assemble/blokebot-zip/archive/*.zip; do
            archive=$(realpath "$archive")
            temporary=$(mktemp -d)
            normalized="${archive%.zip}.normalized.zip"
            unzip -q "$archive" -d "$temporary"
            find "$temporary" -exec touch -h -d '2026-01-01T00:00:00Z' {} +
            (cd "$temporary" && find . -mindepth 1 -print | LC_ALL=C sort | zip -X -y -q "$normalized" -@)
            mv "$normalized" "$archive"
            rm -rf "$temporary"
          done
      - name: Generate checksums and prepare package channels
        run: |
          for phase in checksum prepare; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/workspace" \
              -e JRELEASER_PROJECT_VERSION \
              -e JRELEASER_GITHUB_TOKEN \
              "$JRELEASER_IMAGE" \
              "$phase" --strict --reproducible \
              --basedir /workspace \
              --config-file packaging/jreleaser/jreleaser.yml
          done
      - name: Validate archive, checksum, and package inventory
        run: |
          find out/jreleaser/assemble -maxdepth 4 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) \
            -printf '%f\n' | sort > artifacts/archive-inventory.txt
          cat > artifacts/expected-archive-inventory.txt <<'EOF'
          blokebot-v1.2.3-linux-arm64.tar.gz
          blokebot-v1.2.3-linux-x64.tar.gz
          blokebot-v1.2.3-osx-arm64.zip
          blokebot-v1.2.3-win-arm64.zip
          blokebot-v1.2.3-win-x64.zip
          EOF
          diff -u artifacts/expected-archive-inventory.txt artifacts/archive-inventory.txt

          cp out/jreleaser/checksums/checksums_sha256.txt artifacts/checksums_sha256.txt
          cmp out/jreleaser/checksums/checksums_sha256.txt artifacts/checksums_sha256.txt
          while IFS= read -r archive; do
            source=$(find out/jreleaser/assemble -type f -name "$archive" -print -quit)
            cp "$source" artifacts/
          done < artifacts/archive-inventory.txt
          (cd artifacts && sha256sum --check checksums_sha256.txt)

          test -f out/jreleaser/prepare/blokebot/brew/Formula/blokebot.rb
          test -f out/jreleaser/prepare/blokebot/scoop/bucket/blokebot.json
          test -f out/jreleaser/prepare/blokebot/chocolatey/blokebot/blokebot.nuspec
          test -f out/jreleaser/prepare/blokebot/winget/manifests/a/alsi-lawr/BlokeBot/1.2.3/alsi-lawr.BlokeBot.installer.yaml
          formula=out/jreleaser/prepare/blokebot/brew/Formula/blokebot.rb
          grep -F 'blokebot-v1.2.3-osx-arm64.zip' "$formula"
          if grep -Eiq 'depends_on.*(java|openjdk)|JAVA_HOME' "$formula"; then
            echo 'Generated Homebrew metadata unexpectedly declares a Java dependency.' >&2
            exit 1
          fi
          grep -F '"bin/blokebot.exe", "blokebot"' out/jreleaser/prepare/blokebot/scoop/bucket/blokebot.json
          grep -F 'Architecture: x64' out/jreleaser/prepare/blokebot/winget/manifests/a/alsi-lawr/BlokeBot/1.2.3/alsi-lawr.BlokeBot.installer.yaml
          if grep -R -F 'win-arm64.zip' out/jreleaser/prepare/blokebot/{scoop,chocolatey,winget}; then
            exit 1
          fi
      - name: Prove archive determinism
        run: |
          find out/jreleaser/assemble -maxdepth 4 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's#out/jreleaser/assemble/[^/]*/archive/##' \
            > artifacts/first-archive-hashes.txt
          rm -rf out/jreleaser/assemble out/jreleaser/checksums
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e JRELEASER_PROJECT_VERSION \
            -e JRELEASER_GITHUB_TOKEN \
            "$JRELEASER_IMAGE" \
            assemble --strict --reproducible \
            --basedir /workspace \
            --config-file packaging/jreleaser/jreleaser.yml
          for archive in out/jreleaser/assemble/blokebot-zip/archive/*.zip; do
            archive=$(realpath "$archive")
            temporary=$(mktemp -d)
            normalized="${archive%.zip}.normalized.zip"
            unzip -q "$archive" -d "$temporary"
            find "$temporary" -exec touch -h -d '2026-01-01T00:00:00Z' {} +
            (cd "$temporary" && find . -mindepth 1 -print | LC_ALL=C sort | zip -X -y -q "$normalized" -@)
            mv "$normalized" "$archive"
            rm -rf "$temporary"
          done
          find out/jreleaser/assemble -maxdepth 4 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's#out/jreleaser/assemble/[^/]*/archive/##' \
            > artifacts/second-archive-hashes.txt
          diff -u artifacts/first-archive-hashes.txt artifacts/second-archive-hashes.txt

  nix:
    name: Evaluate, build, and smoke Nix outputs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Check Nix formatting and all-system evaluation
        run: |
          nix fmt -- --check flake.nix
          nix flake check --no-build --all-systems --show-trace
          nix flake show --all-systems
      - name: Build bot and site packages and inspect apps
        run: |
          nix build .#blokebot --out-link result-bot
          nix build .#blokebot-site --out-link result-site
          test "$(result-bot/bin/blokebot version)" = "blokebot 0.0.0-dev+${GITHUB_SHA}"
          test -x "$(nix eval --raw .#apps.x86_64-linux.blokebot.program)"
          test -x "$(nix eval --raw .#apps.x86_64-linux.blokebot-site.program)"
          test "$(nix eval --raw .#nixosModules.default --apply builtins.typeOf)" = lambda
          test "$(nix eval --raw .#nixosModules.blokebot --apply builtins.typeOf)" = lambda
          test "$(nix eval --raw .#nixosModules.blokebot-site --apply builtins.typeOf)" = lambda
      - name: Build and fully smoke Nix OCI images
        run: |
          revision="$GITHUB_SHA"
          version="0.0.0-dev"
          cli_version="$version+$revision"
          nix build .#blokebot-image --out-link result-bot-image
          nix build .#blokebot-site-image --out-link result-site-image
          bot_image=$(docker load < result-bot-image | sed -n 's/^Loaded image: //p' | tail -n 1)
          site_image=$(docker load < result-site-image | sed -n 's/^Loaded image: //p' | tail -n 1)
          python3 packaging/smoke/container_smoke.py \
            --image "$bot_image" --kind bot --version "$version" --cli-version "$cli_version" --revision "$revision"
          python3 packaging/smoke/container_smoke.py \
            --image "$site_image" --kind site --version "$version" --revision "$revision"

  dockerfiles:
    name: Build ${{ matrix.kind }} Dockerfile on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: bot
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: packaging/docker/blokebot.Dockerfile
            image: docker.io/alsilawr/blokebot
          - kind: bot
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: packaging/docker/blokebot.Dockerfile
            image: docker.io/alsilawr/blokebot
          - kind: site
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: packaging/docker/blokebot-site.Dockerfile
            image: docker.io/alsilawr/blokebot-site
          - kind: site
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: packaging/docker/blokebot-site.Dockerfile
            image: docker.io/alsilawr/blokebot-site
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Confirm native architecture
        run: |
          case "${{ matrix.arch }}" in
            amd64) expected=x86_64 ;;
            arm64) expected=aarch64 ;;
            *) exit 1 ;;
          esac
          test "$(uname -m)" = "$expected"
      - name: Build the root-context Dockerfile
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}:validation-${{ matrix.arch }}" \
            --build-arg BLOKEBOT_VERSION=1.2.3 \
            --build-arg SOURCE_REVISION_ID="$GITHUB_SHA" \
            .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${{ matrix.image }}:validation-${{ matrix.arch }}")" = 1.2.3
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${{ matrix.image }}:validation-${{ matrix.arch }}")" = "$GITHUB_SHA"

  repository:
    name: Validate workflow and repository boundaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.parse_file(path) }'
      - name: Require immutable action pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          action = re.compile(r"^\s*uses:\s*[^#\s]+@([0-9a-f]{40})(?:\s+#.*)?$")
          unpinned = []
          for workflow in Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(workflow.read_text().splitlines(), 1):
                  if line.lstrip().startswith("uses:") and not line.lstrip().startswith("uses: ./") and not action.match(line):
                      unpinned.append(f"{workflow}:{number}:{line.strip()}")
          if unpinned:
              raise SystemExit("Unpinned actions:\n" + "\n".join(unpinned))
          PY
      - name: Assert release publication gates and promotion invariants
        run: |
          ruby <<'RUBY'
          require "set"
          require "yaml"

          release_path = ".github/workflows/release.yml"
          release_text = File.read(release_path)
          jobs = YAML.safe_load_file(release_path, aliases: true).fetch("jobs")

          def assert(condition, message)
            raise message unless condition
          end

          def needs(jobs, job_name)
            Array(jobs.fetch(job_name).fetch("needs", []))
          end

          def depends_on?(jobs, job_name, prerequisite, visited = Set.new)
            return false unless visited.add?(job_name)

            dependencies = needs(jobs, job_name)
            dependencies.include?(prerequisite) || dependencies.any? do |dependency|
              jobs.key?(dependency) && depends_on?(jobs, dependency, prerequisite, visited.dup)
            end
          end

          def step(jobs, job_name, step_name)
            jobs.fetch(job_name).fetch("steps").find { |candidate| candidate["name"] == step_name } ||
              raise("Missing #{job_name} step: #{step_name}")
          end

          def scripts(jobs, job_name)
            jobs.fetch(job_name).fetch("steps").filter_map { |candidate| candidate["run"] }.join("\n")
          end

          gate = "docker-hub-gate"
          %w[release-assets github-release docker-hub-images nix-images].each do |job_name|
            assert(needs(jobs, job_name).include?(gate), "#{job_name} must directly require #{gate}")
          end
          %w[docker-hub-manifests nix-manifests promote-latest].each do |job_name|
            assert(depends_on?(jobs, job_name, gate), "#{job_name} must transitively require #{gate}")
          end
          gate_script = scripts(jobs, gate)
          assert(gate_script.include?("DOCKERHUB_USERNAME is required."), "Docker Hub username is not mandatory")
          assert(gate_script.include?("DOCKERHUB_TOKEN is required."), "Docker Hub token is not mandatory")

          %w[docker-hub-manifests nix-manifests].each do |job_name|
            manifest_script = scripts(jobs, job_name)
            assert(manifest_script.include?(".platform.os"), "#{job_name} does not inspect manifest operating systems")
            assert(manifest_script.include?(".platform.architecture"), "#{job_name} does not inspect manifest architectures")
            assert(manifest_script.include?("linux/amd64 linux/arm64"), "#{job_name} does not require the exact platform set")
            assert(manifest_script.include?("diff -u expected-platforms.txt actual-platforms.txt"), "#{job_name} does not compare the platform inventory")
          end

          promotion = jobs.fetch("promote-latest")
          required_promotion_needs = %w[
            github-release
            publish-homebrew-scoop
            publish-chocolatey
            winget-bundle
            docker-hub-manifests
            nix-manifests
          ]
          assert((required_promotion_needs - needs(jobs, "promote-latest")).empty?, "Latest promotion can run before immutable publication completes")
          assert(promotion.dig("permissions", "contents") == "write", "Latest release promotion lacks contents: write")
          container_promotion = step(jobs, "promote-latest", "Promote only the recorded immutable manifests").fetch("run")
          assert(container_promotion.include?('latest=$(docker buildx imagetools inspect "$image:latest"'), "Container latest tags have no digest readback")
          assert(container_promotion.include?('test "$latest" = "$digest"'), "Container latest digest is not compared with the immutable digest")
          release_promotion = step(jobs, "promote-latest", "Promote the GitHub release to Latest and verify by readback").fetch("run")
          assert(release_promotion.include?('gh release edit "v$VERSION"'), "GitHub release is not promoted to Latest")
          assert(release_promotion.include?('releases/latest'), "GitHub Latest release has no API readback")
          assert(release_promotion.include?('test "$latest_tag" = "v$VERSION"'), "GitHub Latest tag readback is not verified")

          scoop_install = step(jobs, "package-windows-test", "Install pinned Scoop from verified official content")
          assert(scoop_install.dig("env", "SCOOP_INSTALLER_COMMIT") == "b0ee913725139b816f9178163af0aecdba07a7ed", "Scoop installer commit changed")
          assert(scoop_install.dig("env", "SCOOP_INSTALLER_SHA256") == "48f6ea398b3a3fa26fae0093d37bd85b13e7eaa5d1d4a3e208408768408e35ae", "Scoop installer digest changed")
          assert(scoop_install.dig("env", "SCOOP_COMMIT") == "b588a06e41d920d2123ec70aee682bae14935939", "Scoop archive commit changed")
          assert(scoop_install.dig("env", "SCOOP_ARCHIVE_SHA256") == "630206995f30866a0b25b00c14c74be9ef9b79c4911f72f6efd2625cfe19a645", "Scoop archive digest changed")
          assert(scoop_install.dig("env", "SCOOP_MAIN_COMMIT") == "76b24868f4295551f741a1c7ff711975eb89e7dc", "Scoop Main archive commit changed")
          assert(scoop_install.dig("env", "SCOOP_MAIN_ARCHIVE_SHA256") == "9fbb4d1c07aff3c1222ab96688a00bb53662a87323ad3246b7185fc55ab8ee1e", "Scoop Main archive digest changed")
          assert(scoop_install.fetch("run").include?("Get-FileHash -Algorithm SHA256"), "Scoop content is not integrity checked")
          assert(scoop_install.fetch("run").include?("& $installer -RunAsAdmin"), "Elevated Scoop installation does not use the documented flag")
          assert(scoop_install.fetch("run").include?("ScoopInstaller/Scoop/archive/$env:SCOOP_COMMIT.zip"), "Scoop archive URL is not commit-pinned")
          assert(scoop_install.fetch("run").include?("ScoopInstaller/Main/archive/$env:SCOOP_MAIN_COMMIT.zip"), "Scoop Main archive URL is not commit-pinned")
          scoop_lifecycle = step(jobs, "package-windows-test", "Test the mandatory Scoop lifecycle").fetch("run")
          %w[install update uninstall].each do |operation|
            assert(scoop_lifecycle.include?("scoop #{operation}"), "Scoop #{operation} is not mandatory")
          end
          assert(!scoop_lifecycle.include?("Scoop is unavailable"), "Scoop lifecycle can still silently skip")

          winget_job = jobs.fetch("package-winget-test")
          assert(winget_job.fetch("runs-on") == "windows-11-arm", "WinGet lifecycle is not on the Windows client runner")
          winget_install = step(jobs, "package-winget-test", "Require or install the pinned official WinGet client")
          assert(winget_install.dig("env", "WINGET_VERSION") == "1.29.280", "WinGet client version is not immutable")
          assert(winget_install.fetch("run").include?("github.com/microsoft/winget-cli/releases/download/v"), "WinGet is not installed from Microsoft's official release")
          assert(winget_install.fetch("run").include?("Get-FileHash -Algorithm SHA256"), "WinGet content is not integrity checked")
          assert(winget_install.fetch("run").include?("Get-Command winget"), "Runner-provided WinGet is not detected")
          assert(winget_install.fetch("run").include?("runner-provided WinGet client is unusable"), "Broken runner-provided WinGet does not hard-fail")
          winget_lifecycle = step(jobs, "package-winget-test", "Validate and test the mandatory WinGet lifecycle").fetch("run")
          %w[validate install uninstall].each do |operation|
            assert(winget_lifecycle.include?("winget #{operation}"), "WinGet #{operation} is not mandatory")
          end
          assert(!winget_lifecycle.include?("WinGet is unavailable"), "WinGet lifecycle can still silently skip")

          winget_bundle = scripts(jobs, "winget-bundle")
          assert(winget_bundle.include?("No upstream WinGet pull request was created"), "Manual upstream WinGet submission is no longer explicit")
          chocolatey = scripts(jobs, "publish-chocolatey")
          assert(chocolatey.include?("CHOCOLATEY_API_KEY is absent; upload is skipped"), "Chocolatey missing-authority behavior is no longer honest")
          assert(chocolatey.include?("public availability remains pending moderation"), "Chocolatey moderation status is no longer explicit")

          pinned_jreleaser = "jreleaser/jreleaser-slim@sha256:18f1e6106f1a540348cd0aafdb600702397c6873ce1ab5bfc0ad25082d13db5f"
          image_references = release_text.scan(%r{jreleaser/jreleaser-slim@[^\s]+})
          assert(!image_references.empty? && image_references.all? { |reference| reference == pinned_jreleaser }, "Release JReleaser image digest changed")
          RUBY
      - name: Exercise strict release-tag validation
        run: |
          valid() { [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; }
          valid v0.1.0
          valid v10.20.30
          for tag in 0.1.0 v1.2 v1.2.3-rc1 v01.2.3 vx.y.z; do
            if valid "$tag"; then
              echo "Accepted invalid tag $tag" >&2
              exit 1
            fi
          done
      - name: Exercise cross-tool version mismatch rejection
        run: |
          same_version() {
            expected="$1"
            shift
            for actual in "$@"; do
              test "$actual" = "$expected" || return 1
            done
          }
          same_version 1.2.3 1.2.3 1.2.3 1.2.3
          for versions in \
            '1.2.3 1.2.4 1.2.3 1.2.3' \
            '1.2.3 1.2.3 1.2.4 1.2.3' \
            '1.2.3 1.2.3 1.2.3 1.2.4'; do
            read -r expected dotnet_version nix_version jreleaser_version <<< "$versions"
            if same_version "$expected" "$dotnet_version" "$nix_version" "$jreleaser_version"; then
              echo "Accepted mismatched version flow: $versions" >&2
              exit 1
            fi
          done
      - name: Prove removed paths and packaging boundaries
        run: |
          for path in Dockerfile .dockerignore deps.json distribution nix release scripts tests/distribution docs tests/README.md; do
            test ! -e "$path"
          done
          test -f packaging/archives/SERVER_SETUP.md
          test -f packaging/docker/blokebot.Dockerfile
          test -f packaging/docker/blokebot-site.Dockerfile
          test -f packaging/jreleaser/jreleaser.yml
          test -f packaging/nix/deps.json
          test -f packaging/nix/module.nix
          test -f packaging/smoke/native_smoke.py
          test -f packaging/smoke/container_smoke.py
          test "$(grep -c 'Immutable architecture tag already exists' .github/workflows/release.yml)" -eq 2
          test "$(grep -c 'Immutable multi-architecture tag already exists' .github/workflows/release.yml)" -eq 2
          grep -F 'refusing to overwrite it' .github/workflows/release.yml
          if grep -R -E 'BlokeBot[.]Simulation|assets/simulation|simulation-capture|capture-simulation' packaging flake.nix; then
            exit 1
          fi
          if grep -R -E 'checksums[.]toml|release_artifacts[.]py|package_metadata[.]py|run_jreleaser[.]py' .github/workflows/release.yml packaging README.md CONTRIBUTING.md src/BlokeBot.Site; then
            exit 1
          fi
          git diff --check
