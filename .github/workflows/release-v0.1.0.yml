name: Release v0.1.0

on:
  push:
    tags:
      - v0.1.0

permissions: {}

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application, site, and Nix release inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Install pinned Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Restore application, site, tests, and tools
        run: |
          dotnet restore BlokeBot.slnx
          dotnet tool restore
      - name: Check C# formatting
        run: find src tests -type f -name '*.cs' -print0 | xargs -0 dotnet csharpier check
      - name: Build the complete solution with warnings as errors
        run: dotnet build BlokeBot.slnx --no-restore -warnaserror
      - name: Run the complete Microsoft Testing Platform suite
        run: dotnet test BlokeBot.slnx --no-build
      - name: Run release tooling safety tests
        run: python3 -m unittest discover -s tests/distribution -v
      - name: Evaluate every declared Nix system and output
        run: nix flake check --no-build --all-systems --show-trace

  archives:
    name: Archive ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            machine: x86_64
            executable: artifacts/publish/linux-x64/blokebot
            archive: blokebot-v0.1.0-linux-x64.tar.gz
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            executable: artifacts/publish/linux-arm64/blokebot
            archive: blokebot-v0.1.0-linux-arm64.tar.gz
          - rid: osx-arm64
            runner: macos-15
            machine: arm64
            executable: artifacts/publish/osx-arm64/blokebot
            archive: blokebot-v0.1.0-osx-arm64.tar.gz
          - rid: win-x64
            runner: windows-2025
            machine: amd64
            executable: artifacts/publish/win-x64/blokebot.exe
            archive: blokebot-v0.1.0-win-x64.zip
          - rid: win-arm64
            runner: windows-11-arm
            machine: arm64
            executable: artifacts/publish/win-arm64/blokebot.exe
            archive: blokebot-v0.1.0-win-arm64.zip
    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.301
      - name: Confirm the native runner architecture
        shell: pwsh
        run: >-
          python -c "import platform, sys; actual = platform.machine().lower(); expected = '${{ matrix.machine }}'; print(f'runner architecture: {actual}'); sys.exit(0 if actual == expected else 1)"
      - name: Publish the self-contained untrimmed directory
        shell: pwsh
        run: >-
          dotnet publish src/BlokeBot/BlokeBot.csproj
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          --output "artifacts/publish/${{ matrix.rid }}"
          -p:DebugSymbols=false
          -p:DebugType=None
          -p:PublishTrimmed=false
          -p:PublishSingleFile=false
      - name: Smoke version, help, and offline serve
        shell: pwsh
        run: python scripts/release_smoke.py "${{ matrix.executable }}"
      - name: Create and validate the deterministic archive
        shell: pwsh
        run: >-
          python scripts/release_artifacts.py archive
          --rid "${{ matrix.rid }}"
          --publish-dir "artifacts/publish/${{ matrix.rid }}"
          --output-dir artifacts/release
      - name: Upload the final RID archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-assets:
    name: Finalize and attest release assets
    needs: archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download all native archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          path: artifacts/release
          merge-multiple: true
      - name: Generate and verify final checksums
        run: |
          python scripts/release_artifacts.py checksums \
            --archive-dir artifacts/release \
            --output artifacts/release/checksums.toml
          python scripts/release_artifacts.py verify \
            --archive-dir artifacts/release \
            --checksums artifacts/release/checksums.toml
      - name: Attest the final archive and checksum bytes
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: artifacts/release/*
      - name: Upload the exact release asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  images:
    name: Image ${{ matrix.kind }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: blokebot
            output: blokebot-image
            image: ghcr.io/alsi-lawr/blokebot
            arch: amd64
            runner: ubuntu-24.04
            tag: v0.1.0-amd64
          - kind: blokebot
            output: blokebot-image
            image: ghcr.io/alsi-lawr/blokebot
            arch: arm64
            runner: ubuntu-24.04-arm
            tag: v0.1.0-arm64
          - kind: blokebot-site
            output: blokebot-site-image
            image: ghcr.io/alsi-lawr/blokebot-site
            arch: amd64
            runner: ubuntu-24.04
            tag: v0.1.0-amd64
          - kind: blokebot-site
            output: blokebot-site-image
            image: ghcr.io/alsi-lawr/blokebot-site
            arch: arm64
            runner: ubuntu-24.04-arm
            tag: v0.1.0-arm64
    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build the native Nix image
        id: build
        run: |
          image_path=$(nix build ".#${{ matrix.output }}" --no-link --print-out-paths)
          test "$(printf '%s\n' "$image_path" | wc -l)" -eq 1
          echo "path=$image_path" >> "$GITHUB_OUTPUT"
          docker load --input "$image_path"
      - name: Inspect and HTTP-smoke the image
        run: >-
          python scripts/container_smoke.py
          --image "${{ matrix.image }}:${{ matrix.tag }}"
          --kind "${{ matrix.kind == 'blokebot' && 'bot' || 'site' }}"
          --revision "$GITHUB_SHA"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Refuse an existing immutable architecture tag
        run: |
          if docker manifest inspect "${{ matrix.image }}:${{ matrix.tag }}" >/dev/null 2>&1; then
            echo "Immutable image tag already exists: ${{ matrix.image }}:${{ matrix.tag }}" >&2
            exit 1
          fi
      - name: Push the immutable architecture image
        id: push
        run: |
          reference="${{ matrix.image }}:${{ matrix.tag }}"
          docker push "$reference"
          docker pull "$reference"
          repository_digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$reference")
          digest="${repository_digest#*@}"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/digests
          printf '%s@%s\n' "${{ matrix.image }}" "$digest" > \
            "artifacts/digests/${{ matrix.kind }}-${{ matrix.arch }}.digest"
      - name: Attest the immutable architecture digest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Upload the attested architecture digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.kind }}-${{ matrix.arch }}
          path: artifacts/digests/${{ matrix.kind }}-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 7

  image-manifests:
    name: Manifest and attest ${{ matrix.kind }}
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - kind: blokebot
            image: ghcr.io/alsi-lawr/blokebot
          - kind: blokebot-site
            image: ghcr.io/alsi-lawr/blokebot-site
    steps:
      - name: Check out manifest validation tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download native image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-${{ matrix.kind }}-*
          path: artifacts/digests
          merge-multiple: true
      - name: Validate the complete native digest set
        run: >-
          python scripts/oci_manifest.py
          --digest-dir artifacts/digests
          --image "${{ matrix.image }}"
          --output "artifacts/${{ matrix.kind }}-references.txt"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Refuse an existing immutable release tag
        run: |
          if docker manifest inspect "${{ matrix.image }}:v0.1.0" >/dev/null 2>&1; then
            echo "Immutable image tag already exists: ${{ matrix.image }}:v0.1.0" >&2
            exit 1
          fi
      - name: Create the immutable multi-architecture manifest
        id: manifest
        run: |
          mapfile -t references < "artifacts/${{ matrix.kind }}-references.txt"
          test "${#references[@]}" -eq 2
          docker buildx imagetools create \
            --tag "${{ matrix.image }}:v0.1.0" \
            "${references[@]}"
          digest=$(docker buildx imagetools inspect "${{ matrix.image }}:v0.1.0" | \
            sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${{ matrix.image }}" "$digest" > \
            "artifacts/${{ matrix.kind }}.digest"
      - name: Attest the final multi-architecture digest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Upload the final attested image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-image-digest-${{ matrix.kind }}
          path: artifacts/${{ matrix.kind }}.digest
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create immutable GitHub release
    needs:
      - release-assets
      - image-manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release validation tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download the attested release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts/release
      - name: Reverify final archive bytes
        run: >-
          python scripts/release_artifacts.py verify
          --archive-dir artifacts/release
          --checksums artifacts/release/checksums.toml
      - name: Refuse overwrite and create release with exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/tags/v0.1.0"
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create v0.1.0 \
            artifacts/release/blokebot-v0.1.0-linux-x64.tar.gz \
            artifacts/release/blokebot-v0.1.0-linux-arm64.tar.gz \
            artifacts/release/blokebot-v0.1.0-osx-arm64.tar.gz \
            artifacts/release/blokebot-v0.1.0-win-x64.zip \
            artifacts/release/blokebot-v0.1.0-win-arm64.zip \
            artifacts/release/checksums.toml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BlokeBot v0.1.0" \
            --notes "Immutable BlokeBot v0.1.0 application archives and checksums."

  package-metadata:
    name: Generate and validate package-channel metadata
    needs: github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out package-channel tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Java 21 for pinned JReleaser
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the immutable published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/release
          test -z "$(find artifacts/release -mindepth 1 -print -quit)"
          gh release download v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/release \
            --pattern 'blokebot-v0.1.0-*' \
            --pattern checksums.toml
      - name: Verify release assets before generating metadata
        run: >-
          python scripts/release_artifacts.py verify
          --archive-dir artifacts/release
          --checksums artifacts/release/checksums.toml
      - name: Generate deterministic package metadata
        run: >-
          python scripts/package_metadata.py generate
          --release-dir artifacts/release
          --checksums artifacts/release/checksums.toml
          --output-dir artifacts/package-metadata
      - name: Validate generated package metadata
        run: >-
          python scripts/package_metadata.py validate
          --release-dir artifacts/release
          --checksums artifacts/release/checksums.toml
          --output-dir artifacts/package-metadata
      - name: Validate the real JReleaser 1.25.0 schema
        env:
          JRELEASER_GITHUB_TOKEN: validation-only
        run: >-
          python scripts/run_jreleaser.py
          --cache-dir "$RUNNER_TEMP/jreleaser"
          --
          config
          --strict
          --full
          --git-root-search
          --basedir="$GITHUB_WORKSPACE/artifacts/package-metadata/jreleaser"
          --config-file="$GITHUB_WORKSPACE/artifacts/package-metadata/jreleaser/jreleaser.yml"
          --output-directory="$RUNNER_TEMP/jreleaser-output"
      - name: Revalidate the reviewable metadata file set
        run: >-
          python scripts/package_metadata.py validate
          --release-dir artifacts/release
          --checksums artifacts/release/checksums.toml
          --output-dir artifacts/package-metadata
      - name: Upload reviewable package metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-metadata-v0.1.0
          path: artifacts/package-metadata
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package-homebrew-test:
    name: Test Homebrew package lifecycle
    needs: package-metadata
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out package smoke tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download package metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-metadata-v0.1.0
          path: artifacts/package-metadata
      - name: Clean install, smoke, upgrade, and uninstall Homebrew formula
        run: |
          state_directory="$RUNNER_TEMP/blokebot-user-data"
          mkdir -p "$state_directory"
          printf 'preserve\n' > "$state_directory/marker"
          formula="$GITHUB_WORKSPACE/artifacts/package-metadata/homebrew/Formula/blokebot.rb"
          brew install --formula "$formula"
          blokebot version | grep -F 'blokebot 0.1.0'
          blokebot help | grep -F 'blokebot serve'
          python scripts/release_smoke.py "$(command -v blokebot)"
          brew reinstall --formula "$formula"
          test "$(cat "$state_directory/marker")" = preserve
          brew uninstall blokebot
          if command -v blokebot; then
            echo 'Homebrew left the blokebot executable installed.' >&2
            exit 1
          fi
          test "$(cat "$state_directory/marker")" = preserve

  package-windows-test:
    name: Test Windows package lifecycles (${{ matrix.architecture }})
    needs: package-metadata
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Check out package smoke tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download package metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-metadata-v0.1.0
          path: artifacts/package-metadata
      - name: Test Scoop when available on the native runner
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Write-Host '::notice::Scoop is unavailable on this native runner; deterministic manifest validation remains required.'
              exit 0
          }
          $stateDirectory = Join-Path $env:RUNNER_TEMP 'blokebot-scoop-user-data'
          New-Item -ItemType Directory -Force $stateDirectory | Out-Null
          Set-Content (Join-Path $stateDirectory 'marker') 'preserve'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-metadata/scoop/blokebot.json'
          scoop install $manifest
          blokebot version | Select-String -SimpleMatch 'blokebot 0.1.0'
          blokebot help | Select-String -SimpleMatch 'blokebot serve'
          python scripts/release_smoke.py (Get-Command blokebot).Source
          scoop update blokebot
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'Scoop upgrade changed user data.' }
          scoop uninstall blokebot
          if (Get-Command blokebot -ErrorAction SilentlyContinue) { throw 'Scoop left the blokebot shim installed.' }
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'Scoop uninstall changed user data.' }
      - name: Test Chocolatey when available on the native runner
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Write-Host '::notice::Chocolatey is unavailable on this native runner; metadata generation and validation remain required.'
              exit 0
          }
          $stateDirectory = Join-Path $env:RUNNER_TEMP 'blokebot-chocolatey-user-data'
          New-Item -ItemType Directory -Force $stateDirectory | Out-Null
          Set-Content (Join-Path $stateDirectory 'marker') 'preserve'
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'blokebot-chocolatey-package'
          New-Item -ItemType Directory -Force $packageDirectory | Out-Null
          choco pack artifacts/package-metadata/chocolatey/blokebot.nuspec --output-directory $packageDirectory
          choco install blokebot --source $packageDirectory --version 0.1.0 --yes --no-progress
          refreshenv
          blokebot version | Select-String -SimpleMatch 'blokebot 0.1.0'
          blokebot help | Select-String -SimpleMatch 'blokebot serve'
          python scripts/release_smoke.py (Get-Command blokebot).Source
          choco upgrade blokebot --source $packageDirectory --version 0.1.0 --force --yes --no-progress
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'Chocolatey upgrade changed user data.' }
          choco uninstall blokebot --yes --no-progress
          refreshenv
          if (Get-Command blokebot -ErrorAction SilentlyContinue) { throw 'Chocolatey left the blokebot shim installed.' }
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'Chocolatey uninstall changed user data.' }
      - name: Validate and test WinGet when available on the native runner
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Write-Host '::notice::WinGet is unavailable on this native runner; the manual upstream-PR bundle remains unpublished.'
              exit 0
          }
          $stateDirectory = Join-Path $env:RUNNER_TEMP 'blokebot-winget-user-data'
          New-Item -ItemType Directory -Force $stateDirectory | Out-Null
          Set-Content (Join-Path $stateDirectory 'marker') 'preserve'
          $manifestDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-metadata/winget/manifests/a/alsi-lawr/BlokeBot/0.1.0'
          winget validate --manifest $manifestDirectory
          winget settings --enable LocalManifestFiles
          winget install --manifest $manifestDirectory --accept-package-agreements --accept-source-agreements --disable-interactivity
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          blokebot version | Select-String -SimpleMatch 'blokebot 0.1.0'
          blokebot help | Select-String -SimpleMatch 'blokebot serve'
          python scripts/release_smoke.py (Get-Command blokebot).Source
          winget upgrade --id alsi-lawr.BlokeBot --version 0.1.0 --exact --force --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'WinGet upgrade changed user data.' }
          winget uninstall --id alsi-lawr.BlokeBot --exact --disable-interactivity
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if (Get-Command blokebot -ErrorAction SilentlyContinue) { throw 'WinGet left the portable alias installed.' }
          if ((Get-Content (Join-Path $stateDirectory 'marker')) -ne 'preserve') { throw 'WinGet uninstall changed user data.' }

  publish-homebrew-scoop:
    name: Publish Homebrew and Scoop metadata when authorised
    needs:
      - package-homebrew-test
      - package-windows-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out publication boundary
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download validated package metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-metadata-v0.1.0
          path: artifacts/package-metadata
      - name: Detect package-repository publication authority
        id: gate
        env:
          PACKAGE_REPOSITORY_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
        run: |
          if test -z "$PACKAGE_REPOSITORY_TOKEN"; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::PACKAGE_REPOSITORY_TOKEN is absent; Homebrew and Scoop publication is skipped, not reported as successful.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish without creating repositories or overwriting v0.1.0 metadata
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          publish_file() {
            repository="$1"
            source="$2"
            target="$3"
            gh repo view "$repository" >/dev/null
            checkout="$RUNNER_TEMP/${repository##*/}"
            gh repo clone "$repository" "$checkout" -- --depth=1
            if test -e "$checkout/$target"; then
              echo "Refusing to overwrite existing immutable package metadata: $repository/$target" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$checkout/$target")"
            cp "$source" "$checkout/$target"
            git -C "$checkout" config user.name 'github-actions[bot]'
            git -C "$checkout" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$checkout" add -- "$target"
            git -C "$checkout" commit -m 'feat: add blokebot v0.1.0'
            git -C "$checkout" push origin HEAD
          }
          publish_file \
            alsi-lawr/homebrew-tap \
            "$GITHUB_WORKSPACE/artifacts/package-metadata/homebrew/Formula/blokebot.rb" \
            Formula/blokebot.rb
          publish_file \
            alsi-lawr/scoop-bucket \
            "$GITHUB_WORKSPACE/artifacts/package-metadata/scoop/blokebot.json" \
            bucket/blokebot.json

  publish-chocolatey:
    name: Submit Chocolatey package when authorised
    needs: package-windows-test
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Download validated package metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-metadata-v0.1.0
          path: artifacts/package-metadata
      - name: Always build the reviewable Chocolatey metadata package
        shell: pwsh
        run: choco pack artifacts/package-metadata/chocolatey/blokebot.nuspec --output-directory artifacts/chocolatey
      - name: Upload reviewable Chocolatey package metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chocolatey-metadata-v0.1.0
          path: artifacts/chocolatey/blokebot.0.1.0.nupkg
          if-no-files-found: error
          retention-days: 30
      - name: Submit only when the Chocolatey API key exists
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
              Write-Host '::notice::CHOCOLATEY_API_KEY is absent; Chocolatey publication is skipped, not reported as successful.'
              exit 0
          }
          choco push artifacts/chocolatey/blokebot.0.1.0.nupkg `
              --source https://push.chocolatey.org/ `
              --api-key $env:CHOCOLATEY_API_KEY
          Write-Host '::notice::Chocolatey upload completed; public availability remains pending Chocolatey moderation.'

  promote-latest:
    name: Promote attested images to latest
    needs:
      - github-release
      - image-manifests
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download final attested image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: final-image-digest-*
          path: artifacts/digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Promote only the verified immutable digests
        run: |
          test "$(find artifacts/digests -maxdepth 1 -type f -name '*.digest' | wc -l)" -eq 2
          for kind in blokebot blokebot-site; do
            image="ghcr.io/alsi-lawr/$kind"
            reference=$(cat "artifacts/digests/$kind.digest")
            case "$reference" in "$image"@sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
            digest="${reference#*@}"
            release_digest=$(docker buildx imagetools inspect "$image:v0.1.0" | \
              sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
            test "$release_digest" = "$digest"
            docker buildx imagetools create --tag "$image:latest" "$reference"
          done
