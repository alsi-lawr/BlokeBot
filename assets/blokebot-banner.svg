    <path d="M104 82C104 69.85 113.85 60 126 60H241C260.33 60 276 75.67 276 95V139C276 158.33 260.33 174 241 174H168L128 202V174H126C113.85 174 104 164.15 104 152V82Z" fill="url(#violet)"/>
