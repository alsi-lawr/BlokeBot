<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlokeBot simulation frame</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      .stage {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .laptop {
        display: flex;
        flex-direction: column;
        align-items: center;
        filter: drop-shadow(0 28px 34px rgba(15, 23, 42, 0.25));
      }

      .laptop-screen {
        position: relative;
        padding: 14px 14px 12px;
        border: 1px solid #334155;
        border-radius: 18px 18px 10px 10px;
        background: #111827;
      }

      .laptop-screen .capture {
        display: block;
        width: 1180px;
        height: 720px;
        border-radius: 7px;
        background: #fff;
      }

      .laptop-camera {
        position: absolute;
        top: 5px;
        left: 50%;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #64748b;
        transform: translateX(-50%);
      }

      .laptop-base {
        position: relative;
        width: 1240px;
        height: 22px;
        border-radius: 2px 2px 14px 14px;
        background: linear-gradient(180deg, #cbd5e1, #94a3b8);
        clip-path: polygon(2.2% 0, 97.8% 0, 100% 72%, 97% 100%, 3% 100%, 0 72%);
      }

      .laptop-notch {
        width: 120px;
        height: 5px;
        margin: 0 auto;
        border-radius: 0 0 8px 8px;
        background: #e2e8f0;
      }

      .phone {
        position: relative;
        padding: 14px;
        border: 1px solid #334155;
        border-radius: 48px;
        background: #111827;
        box-shadow:
          0 30px 55px rgba(15, 23, 42, 0.3),
          0 8px 18px rgba(15, 23, 42, 0.18);
      }

      .phone .capture {
        display: block;
        width: 390px;
        height: 844px;
        border-radius: 36px;
        background: #fff;
      }

      .phone-speaker {
        position: absolute;
        z-index: 1;
        top: 20px;
        left: 50%;
        width: 72px;
        height: 6px;
        border-radius: 999px;
        background: #334155;
        transform: translateX(-50%);
        pointer-events: none;
      }

      [data-device="laptop"] .phone,
      [data-device="phone"] .laptop {
        display: none;
      }

      .laptop-screen .capture-animation,
      .phone .capture-animation {
        display: none;
      }

      [data-animation="true"] .capture-still {
        display: none;
      }

      [data-animation="true"] .capture-animation {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="laptop" aria-label="Laptop frame">
        <div class="laptop-screen">
          <div class="laptop-camera" aria-hidden="true"></div>
          <img class="capture capture-still" alt="" />
          <canvas
            class="capture capture-animation"
            width="1180"
            height="720"
            aria-hidden="true"
          ></canvas>
        </div>
        <div class="laptop-base" aria-hidden="true">
          <div class="laptop-notch"></div>
        </div>
      </div>

      <div class="phone" aria-label="Phone frame">
        <div class="phone-speaker" aria-hidden="true"></div>
        <img class="capture capture-still" alt="" />
        <canvas
          class="capture capture-animation"
          width="390"
          height="844"
          aria-hidden="true"
        ></canvas>
      </div>
    </main>

    <script>
      (async () => {
        const parameters = new URLSearchParams(window.location.search);
        const device = parameters.get("device");
        const image = parameters.get("image");
        const animation = parameters.get("animation") === "true";
        if (
          !(
            (device === "laptop" || device === "phone") &&
            image?.startsWith("file://")
          )
        ) {
          throw new Error("Invalid simulation frame parameters.");
        }

        document.documentElement.dataset.device = device;
        document.documentElement.dataset.animation = String(animation);

        if (!animation) {
          for (const capture of document.querySelectorAll(".capture-still"))
            capture.src = image;
          return;
        }

        window.blokeBotSetCapture = async (imageUrl) => {
          if (
            !(
              imageUrl?.startsWith("file://") ||
              imageUrl?.startsWith("data:image/png;base64,")
            )
          )
            throw new Error("Invalid simulation animation image.");

          const source = new Image();
          source.src = imageUrl;
          await source.decode();
          for (const canvas of document.querySelectorAll(
            ".capture-animation",
          )) {
            const context = canvas.getContext("2d");
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(source, 0, 0, canvas.width, canvas.height);
          }
          await new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(resolve)),
          );
        };

        await window.blokeBotSetCapture(image);
        document.documentElement.dataset.frameReady = "true";
      })();
    </script>
  </body>
</html>
