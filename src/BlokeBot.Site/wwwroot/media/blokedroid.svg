<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Blokedroid</title>
  <desc id="desc">A blocky cartoon droid with antennae, visor, chunky arms, and square feet.</desc>

  <defs>
    <linearGradient id="bodyShade" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd46f"/>
      <stop offset="1" stop-color="#3f8f46"/>
    </linearGradient>

    <linearGradient id="visorShade" x1="166" y1="160" x2="346" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="#101820"/>

  <g filter="url(#softShadow)">
    <!-- antennae -->
    <path d="M184 104 L144 54" stroke="#79c85e" stroke-width="18" stroke-linecap="round"/>
    <path d="M328 104 L368 54" stroke="#79c85e" stroke-width="18" stroke-linecap="round"/>
    <rect x="128" y="32" width="38" height="38" rx="8" fill="#9ee37d"/>
    <rect x="346" y="32" width="38" height="38" rx="8" fill="#9ee37d"/>

    <!-- head -->
    <rect x="112" y="96" width="288" height="154" rx="26" fill="url(#bodyShade)" stroke="#b7f59d" stroke-width="8"/>

    <!-- ears / side bolts -->
    <rect x="76" y="142" width="42" height="76" rx="12" fill="#4f9f4e" stroke="#b7f59d" stroke-width="6"/>
    <rect x="394" y="142" width="42" height="76" rx="12" fill="#4f9f4e" stroke="#b7f59d" stroke-width="6"/>

    <!-- visor -->
    <rect x="156" y="148" width="200" height="72" rx="18" fill="url(#visorShade)" stroke="#d6ffca" stroke-width="6"/>
    <rect x="188" y="170" width="42" height="28" rx="6" fill="#98f5ff"/>
    <rect x="282" y="170" width="42" height="28" rx="6" fill="#98f5ff"/>
    <rect x="236" y="202" width="40" height="8" rx="4" fill="#87c7cd" opacity="0.55"/>

    <!-- neck -->
    <rect x="214" y="244" width="84" height="34" rx="8" fill="#34783b"/>

    <!-- torso -->
    <rect x="136" y="270" width="240" height="140" rx="24" fill="url(#bodyShade)" stroke="#b7f59d" stroke-width="8"/>

    <!-- chest panel -->
    <rect x="178" y="300" width="156" height="72" rx="14" fill="#2f6d38" stroke="#9ee37d" stroke-width="5"/>
    <rect x="202" y="320" width="34" height="34" rx="8" fill="#99f178"/>
    <rect x="250" y="320" width="60" height="12" rx="6" fill="#b7f59d"/>
    <rect x="250" y="344" width="44" height="12" rx="6" fill="#7edc67"/>

    <!-- arms -->
    <rect x="76" y="286" width="54" height="112" rx="16" fill="#4f9f4e" stroke="#b7f59d" stroke-width="6"/>
    <rect x="382" y="286" width="54" height="112" rx="16" fill="#4f9f4e" stroke="#b7f59d" stroke-width="6"/>
    <rect x="62" y="392" width="68" height="42" rx="12" fill="#7edc67"/>
    <rect x="382" y="392" width="68" height="42" rx="12" fill="#7edc67"/>

    <!-- legs -->
    <rect x="172" y="404" width="62" height="58" rx="12" fill="#3f8f46"/>
    <rect x="278" y="404" width="62" height="58" rx="12" fill="#3f8f46"/>
    <rect x="148" y="452" width="92" height="36" rx="10" fill="#7edc67"/>
    <rect x="272" y="452" width="92" height="36" rx="10" fill="#7edc67"/>
  </g>
</svg>
