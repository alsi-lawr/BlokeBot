    <text x="360" y="205" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" letter-spacing="0.4" fill="#CBD5E1">Own your channel tools.</text>
